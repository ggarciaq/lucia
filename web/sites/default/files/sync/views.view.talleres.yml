          content:
            value: "<h2>Sentitu, pentsatu, ekin</h2>\r\n<h3>Teoría y práctica para habitar el cuerpo con rigor científico</h3>\r\n<p>\r\nMis talleres son una experiencia de dos horas combinada de breve teoría científica con una sesión intensa de vinyasa psicosomático donde unimos cuerpo, mente, emoción y entorno para salir como nueva. \r\n</p>\r\n<p>\r\nPero el conocimiento no se queda en la teoría. Lo llevamos al cuerpo.\r\n</p>\r\n<p>\r\nCada taller propone un recorrido diferente, pero todos comparten una misma intención: unir cuerpo, mente, emoción y contexto para desarrollar una comprensión más completa de nuestra experiencia.\r\n</p>\r\n<p>\r\nDurante dos horas alternaremos momentos de aprendizaje, observación y práctica, creando un espacio en el que la teoría pueda sentirse y la experiencia corporal pueda comprenderse. El rigor científico convive con la escucha personal, porque cada cuerpo tiene su propia historia, sus patrones y sus formas de responder.\r\n</p>\r\n"
            format: full_html
          tokenize: false
